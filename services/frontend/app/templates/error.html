<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>VERDICT — Ошибка</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
    <header class="site-header">
        <div class="logo">CodeArena</div>
        <nav>
            <a href="/">Контесты</a>
        </nav>
    </header>

    <section class="card">
        <div class="section-header">
            <div>
                <span class="section-label">ERROR</span>
                <h2>Что-то пошло не так</h2>
            </div>
        </div>
        <div class="banner banner-error">
            <b>{{ status_code }} {{ code }}</b><br>
            {{ message }}
        </div>
        {% if status_code == 503 %}
        <p>Сервис временно недоступен. Повторите запрос через несколько секунд.</p>
        {% endif %}
        <p><a href="/">Вернуться к списку контестов</a></p>
    </section>
</main>
</body>
</html>
