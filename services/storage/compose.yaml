# Инфраструктура хранения: два PostgreSQL-шарда (+ необязательный третий для демонстрации rebalancer).
# Запуск из корня репозитория:
#   docker compose --env-file .env -f services/storage/compose.yaml up -d
# Третий шард (add-shard 2):
#   docker compose --env-file .env -f services/storage/compose.yaml --profile rebalance up -d postgres_shard_2
# RabbitMQ, Judge0 и сервисы приложения добавляются сюда отдельными PR.

services:
  postgres_shard_0:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_SHARD_0_DB}
      POSTGRES_USER: ${POSTGRES_SHARD_0_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SHARD_0_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_SHARD_0_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_shard_0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_shard_1:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_SHARD_1_DB}
      POSTGRES_USER: ${POSTGRES_SHARD_1_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SHARD_1_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_SHARD_1_PUBLISHED_PORT:-5434}:5432"
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_shard_2:
    profiles: ["rebalance"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_SHARD_2_DB:-verdict}
      POSTGRES_USER: ${POSTGRES_SHARD_2_USER:-verdict}
      POSTGRES_PASSWORD: ${POSTGRES_SHARD_2_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_SHARD_2_PUBLISHED_PORT:-5435}:5432"
    volumes:
      - postgres_shard_2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_shard_0_data:
  postgres_shard_1_data:
  postgres_shard_2_data:
