# Полный стенд VERDICT: два шарда PostgreSQL, RabbitMQ, миграции + seed, API, worker, frontend.
#
#   cp .env.example .env
#   docker compose up --build
#
# Frontend: http://localhost:8080   API: http://localhost:8000/docs   RabbitMQ UI: http://localhost:15672

x-shards-env: &shards-env
  POSTGRES_SHARD_0_HOST: postgres_shard_0
  POSTGRES_SHARD_0_PORT: "5432"
  POSTGRES_SHARD_0_DB: ${POSTGRES_SHARD_0_DB:-verdict}
  POSTGRES_SHARD_0_USER: ${POSTGRES_SHARD_0_USER:-verdict}
  POSTGRES_SHARD_0_PASSWORD: ${POSTGRES_SHARD_0_PASSWORD:-change_me}
  POSTGRES_SHARD_1_HOST: postgres_shard_1
  POSTGRES_SHARD_1_PORT: "5432"
  POSTGRES_SHARD_1_DB: ${POSTGRES_SHARD_1_DB:-verdict}
  POSTGRES_SHARD_1_USER: ${POSTGRES_SHARD_1_USER:-verdict}
  POSTGRES_SHARD_1_PASSWORD: ${POSTGRES_SHARD_1_PASSWORD:-change_me}
  ACTIVE_SHARDS: ${ACTIVE_SHARDS:-postgres_shard_0,postgres_shard_1}
  SHARD_VIRTUAL_NODES: ${SHARD_VIRTUAL_NODES:-128}

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-verdict}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change_me}

services:
  postgres_shard_0:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_SHARD_0_DB:-verdict}
      POSTGRES_USER: ${POSTGRES_SHARD_0_USER:-verdict}
      POSTGRES_PASSWORD: ${POSTGRES_SHARD_0_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_SHARD_0_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_shard_0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_shard_1:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_SHARD_1_DB:-verdict}
      POSTGRES_USER: ${POSTGRES_SHARD_1_USER:-verdict}
      POSTGRES_PASSWORD: ${POSTGRES_SHARD_1_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_SHARD_1_PUBLISHED_PORT:-5434}:5432"
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-verdict}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["sh", "-c", "python -m storage.cli migrate && python -m storage.cli seed && python -m storage.cli distribution"]
    environment:
      <<: *shards-env
    depends_on:
      postgres_shard_0:
        condition: service_healthy
      postgres_shard_1:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: [*shards-env, *rabbit-env]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  processing:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    environment:
      <<: [*shards-env, *rabbit-env]
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0:2358}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-3}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-2}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: services/frontend
    environment:
      API_BASE_URL: http://api:8000
      USE_MOCKS: "false"
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres_shard_0_data:
  postgres_shard_1_data:
